# squat/generic-device-plugin, restricted to the AMD render node on mr2.
# Announces the extended resource devic.es/dri-render (1 per node). A pod that requests it
# gets /dev/dri/renderD128 added to its device cgroup, so Jellyfin needs no privileged mode
# and no hostPath. Based on upstream manifests/generic-device-plugin.yaml (release 0.2.0).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: generic-device-plugin
    app.kubernetes.io/part-of: mr-do-jellyfin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-device-plugin
        app.kubernetes.io/part-of: mr-do-jellyfin
    spec:
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      # Only the node with the AMD GPU.
      nodeSelector:
        kubernetes.io/hostname: mr2
      tolerations:
        - operator: Exists
          effect: NoExecute
        - operator: Exists
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generic-device-plugin
          # Release 0.2.0 = commit 7626d56; multi-arch index digest.
          image: docker.io/squat/generic-device-plugin:7626d56@sha256:11fa77056eb09661c08ab9760778eec7fded67b0119fff2536b064b28d1211c1
          imagePullPolicy: IfNotPresent
          args:
            - --device
            - |
              name: dri-render
              groups:
                - count: 1
                  paths:
                    - path: /dev/dri/renderD128
          # Host /dev is mounted read-only over the container's /dev, so the kubelet cannot create
          # the default /dev/termination-log mount point there (runc: read-only file system).
          terminationMessagePath: /tmp/termination-log
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 10Mi
            limits:
              cpu: 50m
              memory: 20Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
              readOnly: true
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: dev
          hostPath:
            path: /dev
            type: Directory
