apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mr-do-jellyfin-gpu-device-plugin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ElTabaco/mr-jellyfin.git
    targetRevision: main
    path: kubernetes/platform/gpu-device-plugin/manifests
  destination:
    server: https://kubernetes.default.svc
    # kube-system: the only namespace where system-node-critical pods are admitted by default.
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
