# Environment values for the mr home lab (k3s mr0 + mr2). Applied on top of values.yaml
# by kubernetes/application.yaml. Values verified in Phase 0 (docs/architecture.md).

publishedServerUrl: "http://192.168.0.5:8096"

# GPU node (AMD Radeon 780M / VCN 4.0). Only node with an AMD GPU.
nodeSelector:
  kubernetes.io/hostname: mr2

gpu:
  # Phase 4 switches this on after the device plugin is deployed and vainfo is verified.
  enabled: false
  renderGroupId: 992

service:
  # Approved 2026-11-10 (free in MetalLB pool first-pool 192.168.0.2-29).
  loadBalancerIP: 192.168.0.5
  addressPool: first-pool
  loadBalancerSourceRanges:
    - 192.168.0.0/24

networkPolicy:
  lanCidrs:
    - 192.168.0.0/24

persistence:
  config:
    localPath: /var/lib/mr-jellyfin/config
    node: mr2
  cache:
    localPath: /var/lib/mr-jellyfin/cache
    node: mr2
  media:
    # PENDING Phase 2: Synology NAS host name and NFS export of the USB volume.
    server: ""
    path: ""
    size: 500Gi
  backup:
    # Same NFS server as the other mr-do-* apps; included in mr0's monthly backup.timer archive.
    server: mr0.local
    path: /srv/nfs4/homes/mr/jellyfin/backup
