# Environment values for the mr home lab (k3s mr0 + mr2). Applied on top of values.yaml
# by kubernetes/application.yaml. Values verified in Phase 0 (docs/architecture.md).

publishedServerUrl: "http://192.168.0.5:8096"

# GPU node (AMD Radeon 780M / VCN 4.0). Only node with an AMD GPU.
nodeSelector:
  kubernetes.io/hostname: mr2

gpu:
  # Phase 4 (2026-11-11): device plugin verified, vainfo + ffmpeg tests passed
  # (docs/hardware-compatibility.md).
  enabled: true
  renderGroupId: 992

service:
  # Approved 2026-11-10 (free in MetalLB pool first-pool 192.168.0.2-29).
  loadBalancerIP: 192.168.0.5
  addressPool: first-pool
  loadBalancerSourceRanges:
    - 192.168.0.0/24

networkPolicy:
  lanCidrs:
    - 192.168.0.0/24

persistence:
  config:
    localPath: /var/lib/mr-jellyfin/config
    node: mr2
  cache:
    localPath: /var/lib/mr-jellyfin/cache
    node: mr2
  media:
    # Synology DS220+ (mr-synology-nas, 192.168.0.233, DHCP; name from the router DNS), DSM share "usbmedia"
    # = WD Red SA500 500 GB USB SSD (ext4, 458G). NFS rule: mr2 + mr0 read-only, root squashed (Phase 2).
    server: riemerkNASS.local
    path: /volumeUSB1/usbshare/media
    size: 458Gi
  backup:
    # Same NFS server as the other mr-do-* apps; included in mr0's monthly backup.timer archive.
    server: mr0.local
    path: /srv/nfs4/homes/mr/jellyfin/backup

preflight:
  # Folders below /volumeUSB1/usbshare/media (created / reorganised in Phase 2).
  libraries:
    - movies
    - series
    - documentaries
    - home-videos
    - music

# Phase 5 (2026-11-11): only streams on the broadcaster's own CDN that play from this connection
# (Switzerland) without tokens or DRM, tested master playlist -> variant -> segment
# (docs/plugins-and-sources.md). International ("int") feeds; the URL is the highest-quality variant
# playlist where its name is stable (ffmpeg would otherwise start with the first, lowest variant);
# 3sat and ORF III keep the master playlist (hashed / redirected variant URLs).
# Phase 6 (2026-11-11): jellyfin_exporter sidecar (rebelcore v1.6.0, released 2026-10-26, active).
# The annotation-based scrape then targets the exporter port (one port per pod in that job).
exporter:
  enabled: true
  # transcoding: per-session codec/hw/reason; tasks: scheduled task status (library scan, guide);
  # storage: free/used bytes of the library and data paths.
  extraCollectors: [transcoding, tasks, storage]

liveTv:
  enabled: true
  # Programme guide: teleboy.ch listings via the iptv-org/epg grabber (owner decision 2026-11-11).
  epg:
    enabled: true
  channels:
    - id: DasErste.de@HD
      name: Das Erste
      group: ARD
      url: "https://daserste-live.ard-mcdn.de/daserste/live/hls/int/master1080p5000.m3u8"
      epgSite: teleboy.ch
      epgSiteId: "309"
    - id: 3sat.de@SD
      name: 3sat
      group: ZDF/3sat
      url: "https://zdf-hls-18.akamaized.net/hls/live/2016501/dach/high/master.m3u8"
      # variants are video-only (audio as separate renditions): served reduced to 720p50 + audio
      pinResolution: "1280x720"
      epgSite: teleboy.ch
      epgSiteId: "311"
    - id: tagesschau24.de@SD
