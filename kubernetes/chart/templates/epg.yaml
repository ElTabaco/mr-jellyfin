{{- if and .Values.liveTv.enabled .Values.liveTv.epg.enabled }}
{{- $fn := include "jf.fullname" . -}}
{{- $e := .Values.liveTv.epg -}}
# Programme guide: iptv-org/epg grabber (scheduled inside the container) + static file server.
# Jellyfin reads http://<release>-epg:<port>/guide-clean.xml as XMLTV listings provider
# (scripts/configure-livetv.py --epg-url). Channel ids = liveTv.channels[].id (M3U tvg-id).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fn }}-epg
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "jf.labels" . | nindent 4 }}
data:
  channels.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <channels>
    {{- range .Values.liveTv.channels }}
    {{- if and .epgSite .epgSiteId }}
      <channel site="{{ .epgSite }}" lang="{{ .epgLang | default "de" }}" xmltv_id="{{ .id }}" site_id="{{ .epgSiteId }}">{{ .name }}</channel>
    {{- end }}
    {{- end }}
    </channels>
  # pin sidecar: one line per channel with pinResolution: <slug> <master url> <resolution>
  pins.txt: |
    {{- range .Values.liveTv.channels }}
    {{- if .pinResolution }}
    {{ regexReplaceAll "[^a-z0-9]+" (lower (.id | default .name)) "-" }} {{ .url }} {{ .pinResolution }}
    {{- end }}
    {{- end }}
  # Reduce an HLS master to the variant with RESOLUTION=R plus the DEFAULT=YES audio rendition of its
  # audio group; relative URIs become absolute (B = scheme://host, D = master directory). Exit 1 if the
  # variant is missing (the previous file stays).
  pin.awk: |
    function abs(u) { if (u ~ /^https?:\/\//) return u; if (u ~ /^\//) return B u; return D "/" u }
    { l[NR] = $0 }
    END {
      for (i = 1; i <= NR; i++) if (l[i] ~ /^#EXT-X-STREAM-INF/ && index(l[i], R)) { v = i; break }
      if (!v) exit 1
      g = ""
      if (match(l[v], /AUDIO="[^"]*"/)) g = substr(l[v], RSTART + 7, RLENGTH - 8)
      print "#EXTM3U"
      print "#EXT-X-INDEPENDENT-SEGMENTS"
      for (i = 1; i <= NR; i++) {
        s = l[i]
        if (g != "" && s ~ /^#EXT-X-MEDIA:TYPE=AUDIO/ && index(s, "GROUP-ID=\"" g "\"") && s ~ /DEFAULT=YES/) {
          if (match(s, /URI="[^"]*"/)) s = substr(s, 1, RSTART - 1) "URI=\"" abs(substr(s, RSTART + 5, RLENGTH - 6)) "\"" substr(s, RSTART + RLENGTH)
          print s
        }
      }
      s = l[v]
      gsub(/,SUBTITLES="[^"]*"/, "", s)
      print s
      for (j = v + 1; j <= NR; j++) if (l[j] != "" && l[j] !~ /^#/) { print abs(l[j]); break }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-epg
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "jf.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $fn }}-epg
      app.kubernetes.io/name: epg
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ $fn }}-epg
        app.kubernetes.io/name: epg
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: mr-do-jellyfin
      annotations:
        # subPath mounts do not follow ConfigMap updates: roll the pod when the channel list changes.
        checksum/channels: {{ toJson .Values.liveTv.channels | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # uid/gid 1000 = user "node" in the node:alpine based image.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: epg
          image: {{ include "jf.image" $e.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /tmp
            - name: TZ
              value: {{ .Values.timeZone | quote }}
            - name: CRON_SCHEDULE
              value: {{ $e.schedule | quote }}
            - name: RUN_AT_STARTUP
              value: "true"
            - name: DAYS
              value: {{ $e.days | quote }}
            - name: MAX_CONNECTIONS
              value: {{ $e.maxConnections | quote }}
            # The grabber loads the iptv-org channel database (~400 MB heap); node's default heap
            # limit derived from the container limit is too small (OOM at 768Mi).
            - name: NODE_OPTIONS
              value: {{ printf "--max-old-space-size=%d" (int $e.nodeHeapMb) | quote }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          securityContext:
            {{- include "jf.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml $e.resources | nindent 12 }}
          volumeMounts:
            - name: public
              mountPath: /epg/public
            - name: channels
              mountPath: /epg/public/channels.xml
              subPath: channels.xml
              readOnly: true
            - name: tmp
              mountPath: /tmp
        # Jellyfin's XMLTV reader (Jellyfin.XmlTv, 12.4) throws in ProcessStarRating on an empty
        # <star-rating system="IMDb"/> (no <value>), which the teleboy.ch listings contain; the whole
        # channel then gets no programmes. This sidecar writes guide-clean.xml without empty ratings.
        - name: sanitize
          image: {{ include "jf.image" $e.image }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                if [ -s /epg/public/guide.xml ]; then
                  sed -E -e 's#<star-rating[^>]*/>##g' -e 's#<star-rating[^>]*>[[:space:]]*</star-rating>##g' \
                    /epg/public/guide.xml > /epg/public/.guide-clean.tmp \
                    && mv /epg/public/.guide-clean.tmp /epg/public/guide-clean.xml
                fi
                sleep 300
              done
          securityContext:
            {{- include "jf.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: public
              mountPath: /epg/public
        # Channels with pinResolution: their master lists video-only variants with separate audio
        # renditions, so a variant URL alone has no sound and ffmpeg (Jellyfin) would start on the
        # first, lowest variant of the full master. Serve a reduced master instead (/pin/<slug>.m3u8).
        - name: pin
          image: {{ include "jf.image" $e.image }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /epg/public/pin
              while true; do
                while read -r slug url res; do
                  [ -n "$slug" ] || continue
                  base=$(echo "$url" | sed -E 's#^(https?://[^/]+).*#\1#')
                  if wget -q -T 20 -O /tmp/pin-master.m3u8 "$url" \
                    && awk -v B="$base" -v D="${url%/*}" -v R="RESOLUTION=$res" -f /pin/pin.awk \
                      /tmp/pin-master.m3u8 > "/epg/public/pin/.$slug.tmp"; then
                    mv "/epg/public/pin/.$slug.tmp" "/epg/public/pin/$slug.m3u8"
                  else
                    echo "pin: $slug: master not fetched or no $res variant; previous file kept"
                    rm -f "/epg/public/pin/.$slug.tmp"
                  fi
                done < /pin/pins.txt
                sleep 300
              done
          securityContext:
            {{- include "jf.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: public
              mountPath: /epg/public
            - name: pin
              mountPath: /pin
              readOnly: true
            - name: pin-tmp
              mountPath: /tmp
      volumes:
        - name: public
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: channels
          configMap:
            name: {{ $fn }}-epg
        - name: pin
          configMap:
            name: {{ $fn }}-epg
            items:
              - {key: pins.txt, path: pins.txt}
              - {key: pin.awk, path: pin.awk}
        - name: pin-tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-epg
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "jf.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ $fn }}-epg
    app.kubernetes.io/name: epg
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ $e.port }}
      targetPort: http
      protocol: TCP
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-epg
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "jf.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ $fn }}-epg
  policyTypes:
    - Ingress
  ingress:
    # Only Jellyfin reads the guide.
    - from:
        - podSelector:
            matchLabels:
              {{- include "jf.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 3000
{{- end }}
{{- end }}
