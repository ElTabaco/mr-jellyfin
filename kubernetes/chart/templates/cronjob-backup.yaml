{{- if .Values.backup.enabled }}
{{- $fn := include "jf.fullname" . -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $fn }}-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "jf.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: {{ .Values.timeZone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/component: backup
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ .Values.backup.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: jellyfin-backup
            app.kubernetes.io/component: backup
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          serviceAccountName: {{ $fn }}
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.securityContext.runAsUser }}
            runAsGroup: {{ .Values.securityContext.runAsGroup }}
            seccompProfile:
              type: RuntimeDefault
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: backup
              image: {{ include "jf.image" .Values.backup.image }}
              imagePullPolicy: IfNotPresent
              command: ["python3", "/scripts/backup.py"]
              env:
                - name: TZ
                  value: {{ .Values.timeZone | quote }}
                - name: CONFIG_DIR
                  value: /config
                - name: BACKUP_DIR
                  value: /backup
                - name: WORK_DIR
                  value: /work
                - name: KEEP
                  value: {{ .Values.backup.keep | quote }}
                - name: KEEP_LOCAL_API_ARCHIVES
                  value: {{ .Values.backup.keepLocalApiArchives | quote }}
                - name: JELLYFIN_URL
                  value: {{ printf "http://%s.%s.svc.cluster.local:%v" $fn .Release.Namespace .Values.service.port | quote }}
                - name: JELLYFIN_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.apiKeySecret }}
                      key: {{ .Values.backup.apiKeySecretKey }}
                      optional: true
              securityContext:
                {{- include "jf.containerSecurityContext" . | nindent 16 }}
                readOnlyRootFilesystem: true
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: config
                  mountPath: /config
                - name: backup
                  mountPath: /backup
                - name: work
                  mountPath: /work
          volumes:
            - name: scripts
              configMap:
                name: {{ $fn }}-scripts
                defaultMode: 0555
            - name: config
              persistentVolumeClaim:
                claimName: {{ $fn }}-pvc-config
            - name: backup
              persistentVolumeClaim:
                claimName: {{ $fn }}-pvc-backup
            - name: work
              emptyDir:
                sizeLimit: 10Gi
{{- end }}
